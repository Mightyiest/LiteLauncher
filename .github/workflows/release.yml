name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v6.6.21-PlayProtect)'
        required: false
        default: 'v6.6.21-PlayProtect'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "${GITHUB_WORKSPACE}/release-keystore.jks"
          fi

      - name: Build Signed Release & Debug APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlayprotectRelease assemblePlayprotectDebug assembleStandardRelease --stacktrace

      - name: Verify PlayProtect APK manifests have no AccessibilityService
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT_BIN="$(ls -1 "$SDK_DIR"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT_BIN" ]; then
            echo "ERROR: aapt not found under $SDK_DIR/build-tools"
            exit 1
          fi
          for apk in app/build/outputs/apk/playprotect/release/app-playprotect-release.apk app/build/outputs/apk/playprotect/debug/app-playprotect-debug.apk; do
            echo "Inspecting merged AndroidManifest.xml in $apk"
            MANIFEST_DUMP="$("$AAPT_BIN" dump xmltree "$apk" AndroidManifest.xml)"
            if printf '%s\n' "$MANIFEST_DUMP" | grep -qiE 'BIND_ACCESSIBILITY_SERVICE|AccessibilityService|MyAccessibilityService'; then
              echo "ERROR: Accessibility components/permissions found in $apk!"
              printf '%s\n' "$MANIFEST_DUMP" | grep -iE 'BIND_ACCESSIBILITY_SERVICE|AccessibilityService|MyAccessibilityService'
              exit 1
            fi
            echo "Verified clean: $apk"
          done

      - name: Prepare APK artifacts
        id: prep
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v6.6.21-PlayProtect"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [[ "$TAG" == *PlayProtect* ]]; then
            BASE_VER="${TAG%-PlayProtect}"
            echo "base_ver=${BASE_VER}" >> "$GITHUB_OUTPUT"
            echo "is_playprotect=true" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/playprotect/release/app-playprotect-release.apk "dist/LiteLauncher-PlayProtect-${BASE_VER}-release.apk"
            cp app/build/outputs/apk/playprotect/debug/app-playprotect-debug.apk "dist/LiteLauncher-PlayProtect-${BASE_VER}-debug.apk"
          else
            echo "base_ver=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_playprotect=false" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/playprotect/release/app-playprotect-release.apk "dist/LiteLauncher-PlayProtect-${TAG}-release.apk"
            cp app/build/outputs/apk/playprotect/debug/app-playprotect-debug.apk "dist/LiteLauncher-PlayProtect-${TAG}-debug.apk"
            cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/LiteLauncher-${TAG}-standard-release.apk"
          fi
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-${{ steps.prep.outputs.tag }}-apks
          path: dist/*.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          BASE_VER: ${{ steps.prep.outputs.base_ver }}
          IS_PLAYPROTECT: ${{ steps.prep.outputs.is_playprotect }}
        run: |
          if [[ "$IS_PLAYPROTECT" == "true" ]]; then
            RELEASE_TITLE="PlayProtect (LiteLauncher ${BASE_VER})"
            cat <<'EOF' > release_notes.md
          ## PlayProtect (LiteLauncher __BASE_VER__)

          This **PlayProtect** build completely removes `BIND_ACCESSIBILITY_SERVICE` and `MyAccessibilityService` from the APK manifest, resources, and bytecode so **Google Play Protect Enhanced Fraud Protection** allows direct installation without blocking.

          ### Downloads
          - **LiteLauncher-PlayProtect-__BASE_VER__-release.apk** *(Recommended)*: Signed, R8-optimized PlayProtect release build (`app.litelauncher`).
          - **LiteLauncher-PlayProtect-__BASE_VER__-debug.apk**: PlayProtect debug build (`app.litelauncher.debug`, installs side-by-side).

          ### What's New in __BASE_VER__
          - **Reliable Multi-Provider Weather & Location Fallback**: Uses MET Norway, wttr.in, and Open-Meteo with coarse fused/network location and automatic IP-geolocation fallback when location permission or GPS/network providers are unavailable, plus higher touch priority and instant unit-switch refresh.
          - **Location-based Weather label**: Shows `City · Temp Condition` under the Home date (with °C / °F / Off in Settings and tap-to-enable/refresh).
          - **Mindful App Pause**: Adds a 4-second breath countdown with today's usage time before opening selected distracting apps.
          - **Biometric / PIN Lock for Hidden Apps**: Secures hidden apps access, lock disabling, and backup export using fingerprint or device screen lock.
          - **Custom Font Picker**: Choose `Light`, `System`, `Mono`, `Serif`, or `Condensed` across the Home screen and App Drawer.
          - **Backup & Restore**: Export and restore settings and app labels/collections as JSON via Android's file picker without broad storage permissions.

          ### Behavior Differences in PlayProtect Edition
          - **Double-tap to lock** uses `DeviceAdmin` instead of Accessibility Service (unlocking afterward uses PIN/pattern on Android 9+, or you can use the phone's power button).
          - Includes all stability & performance fixes from `v6.6.18` (main-thread I/O offloading, `DeviceAdmin` receiver fixes, contact search deduplication, `AppDrawerAdapter` fixes, `SharedPreferences` safety).
          EOF
            sed -i "s/__BASE_VER__/${BASE_VER}/g" release_notes.md
          else
            RELEASE_TITLE="LiteLauncher ${TAG}"
            cat <<'EOF' > release_notes.md
          ## LiteLauncher __TAG__

          ### Downloads
          - **LiteLauncher-__TAG__-standard-release.apk**: Signed standard release build (`app.litelauncher`, includes Accessibility Service for fingerprint-friendly Double-tap to lock).
          - **LiteLauncher-PlayProtect-__TAG__-release.apk**: Signed PlayProtect release build (`app.litelauncher`, Accessibility Service removed to satisfy Google Play Protect Enhanced Fraud Protection).
          - **LiteLauncher-PlayProtect-__TAG__-debug.apk**: PlayProtect debug build (`app.litelauncher.debug`, installs side-by-side).
          EOF
            sed -i "s/__TAG__/${TAG}/g" release_notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file release_notes.md
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "$RELEASE_TITLE" --notes-file release_notes.md
          fi
