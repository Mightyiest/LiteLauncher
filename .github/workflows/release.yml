name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v6.6.18)'
        required: false
        default: 'v6.6.18'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode signing keystore
        if: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "${GITHUB_WORKSPACE}/release-keystore.jks"

      - name: Build Signed Release & Debug APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK artifacts
        id: prep
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v6.6.18"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LiteLauncher-${TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LiteLauncher-${TAG}-debug.apk"
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-${{ steps.prep.outputs.tag }}-apks
          path: dist/*.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          cat <<'EOF' > release_notes.md
          ## LiteLauncher __TAG__

          ### Downloads
          - **LiteLauncher-__TAG__-release.apk** *(Recommended)*: Signed, R8-optimized release build (`app.litelauncher`).
          - **LiteLauncher-__TAG__-debug.apk**: Debug build (`app.litelauncher.debug`, installs side-by-side).

          ### Changes in __TAG__
          - Fixed double-tap-to-lock accessibility service configuration for `app.litelauncher`.
          - Fixed `DeviceAdmin` receiver overrides and `SharedPreferences` string-set safety.
          - Improved contact search scoping/deduplication and fixed `AppDrawerAdapter` list diffing & `TextWatcher` leak.
          - Moved Screen Time aggregation, home-screen package checks, and cache cleanup off the main UI thread.
          EOF
          sed -i "s/__TAG__/${TAG}/g" release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "LiteLauncher ${TAG}" --notes-file release_notes.md
          fi
